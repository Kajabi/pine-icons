name: "Pine Icons Production Release"

on:
  workflow_call:
    inputs:
      preid:
        description: Which prerelease id should be used? This is only needed when a version is "prepatch", "preminor", "premajor", or "prerelease".
        type: string
        default: ''

      ref:
        type: string
        description: The branch name, tag, or SHA to be checked out. This can also be left blank.
        default: ''

      tag:
        type: 'string'
        required: true
        description: Which npm tag should this be published to

      version:
        type: string
        description: Which version should be published?

  workflow_dispatch:
    inputs:
      preid:
        type: choice
        description: Which prerelease id should be used? This is only needed when a version is "prepatch", "preminor", "premajor", or "prerelease".
        options:
          - ''
          - alpha
          - beta
          - rc
          - next

      ref:
        type: string
        description: The branch name, tag, or SHA to be checked out. This can also be left blank.
        default: ''

      tag:
        type: choice
        required: true
        description: Which npm tag should this be published to
        options:
          - latest
          - next
          - dev

      version:
        type: choice
        description: Which version should be published?
        options:
          - ''
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

jobs:
  export-icons:
    uses: ./.github/workflows/icon-export.yml
    with:
      preid: ${{ inputs.preid || '' }}
      ref: ${{ inputs.ref || 'main' }}
      tag: ${{ inputs.tag || 'nightly' }}
      version: ${{ inputs.version || '' }}
    secrets: inherit

  release-changes:
    runs-on: ubuntu-latest
    needs: export-icons
    # Trusted publishing mints a short-lived OIDC token for npm. That needs
    # id-token: write here and on the job in nightly.yml that calls this workflow.
    permissions:
      contents: write
      id-token: write
    # Surface whether a publish actually happened so downstream jobs (e.g. the
    # Slack announcement) don't fire on no-op nights.
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest
        run: git pull
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # Node 22 ships npm 10.x; trusted publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm for trusted publishing
        shell: bash
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: npm install
        shell: bash

      - name: Configure user
        run: |
          git config user.name "DSS Automation Bot"
          git config user.email "dev+github-bot@kajabi.com"

      # Fail before `nx release` touches git. nx versions, commits, tags, pushes
      # and creates the GitHub release *before* it publishes, and none of that is
      # undone when the publish fails. Because nx then resolves the current
      # version from the newest git tag, one failed publish leaves git ahead of
      # npm and every later run skips and reports success. That is how 10.3.0 and
      # 10.4.0 came to be tagged and released on GitHub while npm stayed on
      # 10.2.0 (DSS-215). npm now authenticates this job with a short-lived OIDC
      # token exchanged for the Trusted Publisher configured on @pine-ds/icons
      # (PE-2432), so there is no NPM_TOKEN to expire; the up-front check is that
      # this job can mint that token and that npm is new enough to use it.
      - name: Verify npm trusted publishing prerequisites
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in this job. Trusted publishing needs 'id-token: write' on this job and on the job of any workflow that calls this one."
            exit 1
          fi
          NPM_VERSION=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_VERSION} is too old for trusted publishing (needs 11.5.1 or newer)."
            exit 1
          fi
          echo "OIDC token endpoint available; npm ${NPM_VERSION}"

      - name: Build
        run: npx nx run @pine-ds/icons:build
        shell: bash

      - name: Release
        if: inputs.version == ''
        shell: bash
        run: npx nx release --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release using Input Version
        if: inputs.version != ''
        shell: bash
        # Pass inputs.version through the environment instead of interpolating
        # ${{ }} directly into the shell, so a caller-supplied value can't be
        # injected into the command (template-injection hardening).
        run: npx nx release "$VERSION_INPUT" --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}

      # The authoritative publish. The release step above already attempts one,
      # but `nx release` discards the publish result and exits 0 even when npm
      # rejects the upload (nx 20.1.2, src/command-line/release/release.js:219) —
      # which is why a failed publish used to read as a green job. `nx release
      # publish` inspects the per-project exit codes and returns 1 on failure
      # (src/command-line/release/publish.js:21), so a rejected upload fails here.
      #
      # Publishing is driven by "is this version on npm?" rather than by whether
      # this run cut a new version. That also makes the pipeline self-healing: a
      # version stranded in git by an earlier failed publish ships on the next run
      # instead of wedging releases indefinitely. On a normal no-op night, when the
      # version is already published, this costs a single `npm view`.
      #
      # Note `--yes` and `--skip-publish` are mutually exclusive in nx 20.1.2, so
      # the release step's own publish attempt cannot simply be turned off.
      - name: Publish any version missing from npm
        id: publish
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} is already on npm — nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${PKG}@${VERSION} is not on npm — publishing…"
          npx nx release publish
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Belt and braces: confirm the upload is actually queryable, covering a
      # publish that reports success without landing.
      - name: Verify npm publish landed
        if: steps.publish.outputs.published == 'true'
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Verifying ${PKG}@${VERSION} is available on npm…"
          for attempt in 1 2 3 4 5 6; do
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "✓ ${PKG}@${VERSION} confirmed on npm"
              exit 0
            fi
            echo "  not visible yet (attempt ${attempt}/6), waiting 10s…"
            sleep 10
          done
          echo "::error::${PKG}@${VERSION} was NOT published to npm. Check the nx-release-publish output above and the package's Trusted Publisher settings on npmjs.com."
          exit 1

  # A failed release used to be entirely silent: the announcement job only fires
  # on success, so nothing told the team when a publish was rejected. The Aug 11
  # and Aug 13 failures went unnoticed for nine days while npm sat on 10.2.0 and
  # every later run reported success. Alerting on failure is what turns that from
  # a nine-day gap into a same-day fix. See DSS-215.
  #
  # `failure()` covers the release job failing and the icon export failing before
  # it; a skipped or cancelled run does not alert.
  notify-release-failure:
    runs-on: ubuntu-latest
    needs: [export-icons, release-changes]
    if: failure()

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup ENV Vars
        shell: bash
        run: |
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Report what the registry actually has, so the alert shows at a glance
          # whether git and npm have diverged. Never fail the alert over this.
          PKG=$(node -p "require('./package.json').name")
          echo "NPM_LATEST=$(npm view "${PKG}" version 2>/dev/null || echo 'unknown')" >> "$GITHUB_ENV"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v3.0.3
        env:
          CHANNEL_ID: ${{ vars.SLACK_CHANNEL_NAME }}
          DATE: ${{ env.CURRENT_DATE }}
          VERSION: ${{ env.PKG_VERSION }}
          NPM_LATEST: ${{ env.NPM_LATEST }}
          RUN_URL: "${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload-templated: true
          payload-file-path: "./.github/workflows/slack_payloads/release-failure.json"

  send-slack-notification:
    runs-on: ubuntu-latest
    needs: release-changes
    # Only announce when something actually reached npm. On no-op nights the
    # current version is already published, so `published` is false and this must
    # not fire a "Pine Icon Release" for a version that shipped days ago.
    if: needs.release-changes.outputs.published == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest
        run: git pull
        shell: bash

      - name: Setup ENV Vars
        run: |
          echo 'PACKAGE_JSON<<EOF' >> $GITHUB_ENV
          cat ./package.json >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log --pretty=format:%s -n 1 HEAD~)" >> $GITHUB_ENV

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v3.0.3
        env:
          CHANNEL_ID: ${{ vars.SLACK_CHANNEL_NAME }}
          DATE: ${{ env.CURRENT_DATE }}
          RELEASE_URL: "${{ format('https://github.com/{0}/releases/tag/v{1}', github.repository, fromJSON(env.PACKAGE_JSON).version) }}"
          CHANGELOG_URL: "${{ format('https://pine-icons.netlify.app/changelogs/{0}-changelog.html', env.CURRENT_DATE) }}"
          VERSION: ${{ fromJson(env.PACKAGE_JSON).version }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload-templated: true
          payload-file-path: "./.github/workflows/slack_payloads/release-info.json"
