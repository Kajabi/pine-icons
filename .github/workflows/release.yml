name: "Pine Icons Production Release"

on:
  workflow_call:
    inputs:
      preid:
        description: Which prerelease id should be used? This is only needed when a version is "prepatch", "preminor", "premajor", or "prerelease".
        type: string
        default: ''

      ref:
        type: string
        description: The branch name, tag, or SHA to be checked out. This can also be left blank.
        default: ''

      tag:
        type: 'string'
        required: true
        description: Which npm tag should this be published to

      version:
        type: string
        description: Which version should be published?

  workflow_dispatch:
    inputs:
      preid:
        type: choice
        description: Which prerelease id should be used? This is only needed when a version is "prepatch", "preminor", "premajor", or "prerelease".
        options:
          - ''
          - alpha
          - beta
          - rc
          - next

      ref:
        type: string
        description: The branch name, tag, or SHA to be checked out. This can also be left blank.
        default: ''

      tag:
        type: choice
        required: true
        description: Which npm tag should this be published to
        options:
          - latest
          - next
          - dev

      version:
        type: choice
        description: Which version should be published?
        options:
          - ''
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

jobs:
  export-icons:
    uses: ./.github/workflows/icon-export.yml
    with:
      preid: ${{ inputs.preid || '' }}
      ref: ${{ inputs.ref || 'main' }}
      tag: ${{ inputs.tag || 'nightly' }}
      version: ${{ inputs.version || '' }}
    secrets: inherit

  release-changes:
    runs-on: ubuntu-latest
    needs: export-icons

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest
        run: git pull
        shell: bash

      - name: Install Dependencies
        run: npm install
        shell: bash

      - name: Configure user
        run: |
          git config user.name "DSS Automation Bot"
          git config user.email "dev+github-bot@kajabi.com"

      - name: Prepare NPM Token
        run: echo //registry.npmjs.org/:_authToken=${NPM_TOKEN} >> .npmrc
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build
        run: npx nx run @pine-ds/icons:build
        shell: bash

      - name: Release
        id: release
        if: inputs.version == ''
        shell: bash
        run: |
          set -o pipefail
          npx nx release --yes 2>&1 | tee "$RUNNER_TEMP/nx-release.log"
          # nx exits 0 whether it published or skipped (no conventional-commit
          # changes). Record which, so the verify step below only runs when a
          # publish was actually attempted.
          if grep -q "Skipped publishing packages" "$RUNNER_TEMP/nx-release.log"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release using Input Version
        id: release_input
        if: inputs.version != ''
        shell: bash
        run: |
          set -o pipefail
          npx nx release ${{inputs.version}} --yes 2>&1 | tee "$RUNNER_TEMP/nx-release.log"
          if grep -q "Skipped publishing packages" "$RUNNER_TEMP/nx-release.log"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guard against `nx release` exiting 0 even when its npm publish phase
      # fails. Without this, a broken publish (e.g. an expired NPM_TOKEN) still
      # tags the version and writes the changelog, so the job reads green while
      # nothing reaches npm — which is exactly how 10.1.0 and 10.2.0 were
      # tagged but never published. See DSS-215.
      #
      # Only runs when the release step actually attempted a publish. On a night
      # with no conventional-commit changes, nx skips versioning and publishing
      # ("Skipped publishing packages") and exits 0 — nothing was meant to reach
      # npm, so asserting the current version is published would fail spuriously.
      - name: Verify npm publish landed
        if: steps.release.outputs.published == 'true' || steps.release_input.outputs.published == 'true'
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Verifying ${PKG}@${VERSION} is available on npm…"
          for attempt in 1 2 3 4 5 6; do
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "✓ ${PKG}@${VERSION} confirmed on npm"
              exit 0
            fi
            echo "  not visible yet (attempt ${attempt}/6), waiting 10s…"
            sleep 10
          done
          echo "::error::${PKG}@${VERSION} was NOT published to npm. The release step exited 0 but the publish phase did not land — check the nx-release-publish output above and the NPM_TOKEN secret."
          exit 1

  send-slack-notification:
    runs-on: ubuntu-latest
    needs: release-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest
        run: git pull
        shell: bash

      - name: Setup ENV Vars
        run: |
          echo 'PACKAGE_JSON<<EOF' >> $GITHUB_ENV
          cat ./package.json >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log --pretty=format:%s -n 1 HEAD~)" >> $GITHUB_ENV

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v3.0.3
        env:
          CHANNEL_ID: ${{ vars.SLACK_CHANNEL_NAME }}
          DATE: ${{ env.CURRENT_DATE }}
          RELEASE_URL: "${{ format('https://github.com/{0}/releases/tag/v{1}', github.repository, fromJSON(env.PACKAGE_JSON).version) }}"
          CHANGELOG_URL: "${{ format('https://pine-icons.netlify.app/changelogs/{0}-changelog.html', env.CURRENT_DATE) }}"
          VERSION: ${{ fromJson(env.PACKAGE_JSON).version }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload-templated: true
          payload-file-path: "./.github/workflows/slack_payloads/release-info.json"
